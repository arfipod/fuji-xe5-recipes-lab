name: Bootstrap prototype

on:
  push:
    branches:
      - feat/initial-research-prototype
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-research-prototype
      - name: Check whether expansion is still required
        id: bootstrap
        shell: bash
        run: |
          if [ -d .bootstrap ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Expand project
        if: steps.bootstrap.outputs.required == 'true'
        shell: bash
        run: |
          cat .bootstrap/archive.part-* | base64 --decode > /tmp/project.tar.xz
          tar -xJf /tmp/project.tar.xz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - uses: actions/setup-node@v4
        if: steps.bootstrap.outputs.required == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.bootstrap.outputs.required == 'true'
      - run: npm run verify
        if: steps.bootstrap.outputs.required == 'true'
      - name: Commit expanded project
        if: steps.bootstrap.outputs.required == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bootstrap: expand project archive"
          git push origin HEAD:feat/initial-research-prototype
