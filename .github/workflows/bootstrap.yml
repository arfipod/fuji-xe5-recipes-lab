name: Bootstrap prototype

on:
  push:
    branches:
      - feat/initial-research-prototype

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, 'bootstrap: expand project archive') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-research-prototype
      - name: Expand project
        shell: bash
        run: |
          cat .bootstrap/archive.part-* | base64 --decode > /tmp/project.tar.xz
          tar -xJf /tmp/project.tar.xz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Commit expanded project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bootstrap: expand project archive"
          git push origin HEAD:feat/initial-research-prototype
